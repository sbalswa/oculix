# Enforce the repository's baseline GitHub Actions policy.
rules:
  unpinned-uses: error
  missing-permissions: error
  local-action-checkout: error
  require-expression-wrapping: error
  unsound-ternary: error
  workflow-run-names: error
  require-shell: error
  max-run-lines: {level: error, max: 30}
  missing-timeout: error
  timeout-too-long: {level: error, max: 30}
