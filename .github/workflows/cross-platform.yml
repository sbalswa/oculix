name: Cross-platform runners
run-name: Cross-platform runners on ${{ inputs.ref || github.head_ref || github.ref_name }}

on:
  pull_request:
    types:
      - synchronize
  workflow_call:
    inputs:
      ref:
        description: Git commit to validate
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-runners-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Read repository configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mise-version: ${{ steps.mise.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Read repository mise pin
        id: mise
        shell: bash
        run: |
          version="$(
            sed -n 's/^min_version = "\([^"]*\)"$/\1/p' mise/config.toml
          )"
          if [[ ! "$version" =~ ^[0-9]+([.][0-9]+){2,3}$ ]]; then
            echo "mise/config.toml must contain one numeric min_version." >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

  run:
    needs: configuration
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        startsWith(github.head_ref, 'automation/toolchain/')
      }}
    name: Run on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ needs.configuration.outputs.mise-version }}
          install_args: --locked

      - name: Run checks on Unix
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: mise run ci
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run checks on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: mise run ci
        env:
          GH_TOKEN: ${{ github.token }}

  oculix:
    needs: configuration
    name: Oculix on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MISE_ENV: oculix
      MISE_LOCKED: "1"

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ needs.configuration.outputs.mise-version }}
          install_args: --locked

      - name: Run Oculix smoke script on Linux
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: xvfb-run -a -s '-screen 0 1280x1024x24' mise run oculix:run

      - name: Run Oculix smoke script on macOS
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: mise run oculix:run

      - name: Run Oculix smoke script on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: mise run oculix:run

  calculator:
    needs:
      - configuration
      - oculix
    name: Calculator on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MISE_ENV: oculix
      MISE_LOCKED: "1"

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ needs.configuration.outputs.mise-version }}
          install_args: --locked

      - name: Install Linux calculator dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fluxbox \
            gnome-calculator \
            xdotool

      - name: Exercise Calculator on Linux
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' \
            dbus-run-session -- \
            bash -euo pipefail -c '
              fluxbox >/dev/null 2>&1 &
              gnome-calculator >/dev/null 2>&1 &
              mise run oculix:run tests/e2e/oculix/native-calculator.sikuli
            '

      - name: Exercise Calculator on macOS
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          open -a Calculator
          mise run oculix:run tests/e2e/oculix/native-calculator.sikuli

      - name: Exercise Calculator on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Start-Process calc.exe
          mise run oculix:run tests/e2e/oculix/native-calculator.sikuli
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload failure screenshot
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calculator-${{ matrix.os }}-failure
          path: calculator-diagnostics/
          if-no-files-found: error
          retention-days: 7
