name: Cross-platform runners
run-name: Cross-platform runners on ${{ inputs.ref || github.head_ref || github.ref_name }}

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_call:
    inputs:
      ref:
        description: Git commit to validate
        required: true
        type: string
      run_e2e:
        description: Run the explicit Phase 1 browser E2E matrix
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run the explicit Phase 1 browser E2E matrix
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  VALIDATION_REF: ${{ inputs.ref || github.ref }}

concurrency:
  group: cross-platform-runners-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  configuration:
    name: Read repository configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mise-version: ${{ steps.mise.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VALIDATION_REF }}
          persist-credentials: false

      - name: Read repository mise pin
        id: mise
        shell: bash
        run: |
          version="$(
            sed -n 's/^min_version = "\([^"]*\)"$/\1/p' mise/config.toml
          )"
          if [[ ! "$version" =~ ^[0-9]+([.][0-9]+){2,3}$ ]]; then
            echo "mise/config.toml must contain one numeric min_version." >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: Summarize selected Phase 1 E2E capabilities
        if: ${{ inputs.run_e2e }}
        shell: bash
        run: |
          cat >>"$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Phase 1 E2E matrix

          Selected 4 explicit capability cells. Each matrix job records its
          stable capability ID, position, task, dimensions, and result.
          EOF

  checks:
    needs: configuration
    name: Repository checks on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{
            fromJSON(
              (
                github.event_name != 'pull_request' ||
                (
                  startsWith(github.head_ref, 'automation/toolchain/') &&
                  github.event.action == 'synchronize'
                )
              ) &&
              '["ubuntu-latest","macos-latest","windows-latest"]' ||
              '["ubuntu-latest"]'
            )
          }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VALIDATION_REF }}
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ needs.configuration.outputs.mise-version }}
          install_args: --locked

      - name: Run repository checks on Unix
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: mise run ci
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run repository checks on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: mise run ci
        env:
          GH_TOKEN: ${{ github.token }}

  e2e:
    if: ${{ inputs.run_e2e }}
    needs: configuration
    name: E2E ${{ matrix.id || 'matrix (opt-in)' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      E2E_BROWSER: ${{ matrix.browser }}
      E2E_OS: ${{ matrix.os }}
      MISE_ENV: ${{ matrix.environment }}
      MISE_LOCKED: "1"
      OCULIX_CHROMIUM_DISABLE_SANDBOX: >-
        ${{ matrix.oculix_chromium_disable_sandbox || '' }}
      E2E_USE_XVFB: ${{ matrix.use_xvfb || false }}

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - id: selenium-ubuntu-chromium
            position: 1
            total: 4
            tool: selenium
            runner: ubuntu-latest
            os: ubuntu
            browser: chromium
            environment: web-e2e
            task: e2e:selenium
            diagnostics: tests/e2e/selenium/diagnostics/
          - id: cypress-ubuntu-chrome
            position: 2
            total: 4
            tool: cypress
            runner: ubuntu-latest
            os: ubuntu
            browser: chrome
            environment: web-e2e
            task: e2e:cypress
            diagnostics: tests/e2e/cypress/diagnostics/
          - id: playwright-ubuntu-chromium
            position: 3
            total: 4
            tool: playwright
            runner: ubuntu-latest
            os: ubuntu
            browser: chromium
            environment: web-e2e
            task: e2e:playwright
            diagnostics: tests/e2e/playwright/test-results/
          - id: oculix-ubuntu-chromium
            position: 4
            total: 4
            tool: oculix
            runner: ubuntu-latest
            os: ubuntu
            browser: chromium
            environment: oculix,web-e2e
            task: e2e:oculix:web-calculator
            diagnostics: oculix-web-calculator-diagnostics/
            linux_packages: xdotool
            oculix_chromium_disable_sandbox: "1"
            use_xvfb: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VALIDATION_REF }}
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ needs.configuration.outputs.mise-version }}
          install_args: --locked

      - name: Install matrix Linux dependencies
        if: ${{ runner.os == 'Linux' && matrix.linux_packages }}
        shell: bash
        env:
          E2E_LINUX_PACKAGES: ${{ matrix.linux_packages }}
        run: |
          read -r -a packages <<<"$E2E_LINUX_PACKAGES"
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes "${packages[@]}"

      - name: Run mise task ${{ matrix.task }} on Unix
        id: run-unix
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          E2E_TASK: ${{ matrix.task }}
        run: |
          if [[ "$E2E_USE_XVFB" == "true" ]]; then
            xvfb-run -a -s '-screen 0 1280x1024x24' \
              mise run "$E2E_TASK"
          else
            mise run "$E2E_TASK"
          fi

      - name: Run mise task ${{ matrix.task }} on Windows
        id: run-windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          E2E_TASK: ${{ matrix.task }}
        run: |
          & mise run $env:E2E_TASK
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Summarize capability result
        if: ${{ always() }}
        shell: bash
        env:
          E2E_BROWSER_NAME: ${{ matrix.browser }}
          E2E_CAPABILITY_ID: ${{ matrix.id }}
          E2E_OS_NAME: ${{ matrix.os }}
          E2E_POSITION: ${{ matrix.position }}
          E2E_RESULT: >-
            ${{
              runner.os == 'Windows' &&
              steps.run-windows.outcome ||
              steps.run-unix.outcome
            }}
          E2E_TASK_NAME: ${{ matrix.task }}
          E2E_TOTAL: ${{ matrix.total }}
          E2E_TOOL_NAME: ${{ matrix.tool }}
        run: |
          {
            printf "### \`%s\`\n\n" "$E2E_CAPABILITY_ID"
            printf -- "- Capability: \`%s\` of \`%s\`\n" \
              "$E2E_POSITION" "$E2E_TOTAL"
            printf -- "- Tool: \`%s\`\n" "$E2E_TOOL_NAME"
            printf -- "- OS: \`%s\`\n" "$E2E_OS_NAME"
            printf -- "- Browser: \`%s\`\n" "$E2E_BROWSER_NAME"
            printf -- "- Task: \`%s\`\n" "$E2E_TASK_NAME"
            printf -- "- Result: \`%s\`\n" "$E2E_RESULT"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.id }}-failure
          path: ${{ matrix.diagnostics }}
          if-no-files-found: warn
          retention-days: 7

  oculix:
    needs: configuration
    name: Oculix on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MISE_ENV: oculix
      MISE_LOCKED: "1"

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VALIDATION_REF }}
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ needs.configuration.outputs.mise-version }}
          install_args: --locked

      - name: Run Oculix smoke script on Linux
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: xvfb-run -a -s '-screen 0 1280x1024x24' mise run oculix:run

      - name: Run Oculix smoke script on macOS
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: mise run oculix:run

      - name: Run Oculix smoke script on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: mise run oculix:run

  calculator:
    needs:
      - configuration
      - oculix
    name: Calculator on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MISE_ENV: oculix
      MISE_LOCKED: "1"

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VALIDATION_REF }}
          persist-credentials: false

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ needs.configuration.outputs.mise-version }}
          install_args: --locked

      - name: Install Linux calculator dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fluxbox \
            gnome-calculator \
            xdotool

      - name: Exercise Calculator on Linux
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          xvfb-run -a -s '-screen 0 1280x1024x24' \
            dbus-run-session -- \
            bash -euo pipefail -c '
              fluxbox >/dev/null 2>&1 &
              gnome-calculator >/dev/null 2>&1 &
              mise run oculix:run tests/e2e/oculix/native-calculator.sikuli
            '

      - name: Exercise Calculator on macOS
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          open -a Calculator
          mise run oculix:run tests/e2e/oculix/native-calculator.sikuli

      - name: Exercise Calculator on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          Start-Process calc.exe
          mise run oculix:run tests/e2e/oculix/native-calculator.sikuli
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload failure screenshot
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: calculator-${{ matrix.os }}-failure
          path: calculator-diagnostics/
          if-no-files-found: error
          retention-days: 7
