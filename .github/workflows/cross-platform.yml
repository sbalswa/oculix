name: Cross-platform runners
run-name: Cross-platform runners on ${{ inputs.ref || github.head_ref || github.ref_name }}

on:
  pull_request:
    types:
      - synchronize
  workflow_call:
    inputs:
      ref:
        description: Git commit to validate
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-runners-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        startsWith(github.head_ref, 'automation/toolchain/')
      }}
    name: Run on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Read repository mise pin on Unix
        if: ${{ runner.os != 'Windows' }}
        id: mise-unix
        shell: bash
        run: |
          version="$(
            sed -n 's/^min_version = "\([^"]*\)"$/\1/p' mise.toml
          )"
          if [[ ! "$version" =~ ^[0-9]+([.][0-9]+){2,3}$ ]]; then
            echo "mise.toml must contain one numeric min_version." >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: Read repository mise pin on Windows
        if: ${{ runner.os == 'Windows' }}
        id: mise-windows
        shell: pwsh
        run: |
          $match = Select-String `
            -Path mise.toml `
            -Pattern '^min_version = "([0-9]+(?:[.][0-9]+){2,3})"$'
          if ($match.Count -ne 1) {
            throw "mise.toml must contain one numeric min_version."
          }
          $version = $match.Matches[0].Groups[1].Value
          Add-Content `
            -Path $env:GITHUB_OUTPUT `
            -Value "version=$version" `
            -Encoding utf8

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: >-
            ${{
              steps.mise-unix.outputs.version ||
              steps.mise-windows.outputs.version
            }}
          install_args: --locked

      - name: Run checks on Unix
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: mise run ci
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run checks on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: mise run ci
        env:
          GH_TOKEN: ${{ github.token }}

  oculix:
    name: Oculix on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MISE_ENV: oculix

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Read repository mise pin on Unix
        if: ${{ runner.os != 'Windows' }}
        id: mise-unix
        shell: bash
        run: |
          version="$(
            sed -n 's/^min_version = "\([^"]*\)"$/\1/p' mise.toml
          )"
          if [[ ! "$version" =~ ^[0-9]+([.][0-9]+){2,3}$ ]]; then
            echo "mise.toml must contain one numeric min_version." >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: Read repository mise pin on Windows
        if: ${{ runner.os == 'Windows' }}
        id: mise-windows
        shell: pwsh
        run: |
          $match = Select-String `
            -Path mise.toml `
            -Pattern '^min_version = "([0-9]+(?:[.][0-9]+){2,3})"$'
          if ($match.Count -ne 1) {
            throw "mise.toml must contain one numeric min_version."
          }
          $version = $match.Matches[0].Groups[1].Value
          Add-Content `
            -Path $env:GITHUB_OUTPUT `
            -Value "version=$version" `
            -Encoding utf8

      - name: Install pinned toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: >-
            ${{
              steps.mise-unix.outputs.version ||
              steps.mise-windows.outputs.version
            }}
          install_args: --locked

      - name: Run Oculix smoke script on Linux
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: xvfb-run -a -s '-screen 0 1280x1024x24' mise run oculix

      - name: Run Oculix smoke script on macOS
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: mise run oculix

      - name: Run Oculix smoke script on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: mise run oculix
