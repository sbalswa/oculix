[tools]
java = "temurin-17"

[tools."http:oculixide"]
version = "4.0.0"

[tools."http:oculixide".platforms.linux-x64]
url = "https://github.com/oculix-org/Oculix/releases/download/v4.0.0/oculixide-4.0.0-linux.jar"

# The upstream Linux jar is shared across architectures.
[tools."http:oculixide".platforms.linux-arm64]
url = "https://github.com/oculix-org/Oculix/releases/download/v4.0.0/oculixide-4.0.0-linux.jar"

[tools."http:oculixide".platforms.macos-arm64]
url = "https://github.com/oculix-org/Oculix/releases/download/v4.0.0/oculixide-4.0.0-macos.jar"

[tools."http:oculixide".platforms.windows-x64]
url = "https://github.com/oculix-org/Oculix/releases/download/v4.0.0/oculixide-4.0.0-windows.jar"

[tasks.oculix]
description = "Run an Oculix script"
run = '''
#!/usr/bin/env bash
set -euo pipefail

script="${1:-basic.sikuli}"
oculix_directory="$(mise where http:oculixide)"
set -- "${oculix_directory}"/*.jar

if [[ "$#" -ne 1 || ! -f "$1" ]]; then
  printf 'Expected exactly one Oculix jar in %s.\n' "$oculix_directory" >&2
  exit 1
fi

exec java -jar "$1" -c -r "$script"
'''
run_windows = '''
#!/usr/bin/env pwsh
$ErrorActionPreference = "Stop"

$script = if ($args.Count -gt 0) { $args[0] } else { "basic.sikuli" }
$oculixDirectory = & mise where http:oculixide
if ($LASTEXITCODE -ne 0) {
    exit $LASTEXITCODE
}

$jars = @(Get-ChildItem -LiteralPath $oculixDirectory -Filter "*.jar" -File)
if ($jars.Count -ne 1) {
    throw "Expected exactly one Oculix jar in ${oculixDirectory}; found $($jars.Count)."
}

& java -jar $jars[0].FullName -c -r $script
exit $LASTEXITCODE
'''
