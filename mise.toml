min_version = "2026.10.3"

[settings]
lockfile = true

[tools]
betterleaks = "1.9.0"
hk = "2.5.0"
jactionlint = "1.8.2"
java = "temurin-17"
shellcheck = "0.11.0"
zizmor = "1.30.1"

[tools."http:oculixide"]
version = "4.0.0"

[tools."http:oculixide".platforms.linux-x64]
url = "https://github.com/oculix-org/Oculix/releases/download/v4.0.0/oculixide-4.0.0-linux.jar"

# linux jar is arch-independent bytecode; arm64 reuses the x64 linux artifact (no separate upstream build)
[tools."http:oculixide".platforms.linux-arm64]
url = "https://github.com/oculix-org/Oculix/releases/download/v4.0.0/oculixide-4.0.0-linux.jar"

[tools."http:oculixide".platforms.macos-arm64]
url = "https://github.com/oculix-org/Oculix/releases/download/v4.0.0/oculixide-4.0.0-macos.jar"

[tools."http:oculixide".platforms.windows-x64]
url = "https://github.com/oculix-org/Oculix/releases/download/v4.0.0/oculixide-4.0.0-windows.jar"

[tasks.setup]
description = "Install the repository's Git hooks"
run = "hk install --mise"

[tasks.ci]
description = "Run the checks required by CI"
run = "hk check --all"

[tasks.oculix]
description = "Run the basic Oculix smoke script"
run = 'java -jar "$(mise where http:oculixide)"/*.jar -c -r basic.sikuli'
