min_version = "2026.10.3"

[settings]
lockfile = true

[tools]
hk = "2.5.0"
jactionlint = "1.8.2"
shellcheck = "0.11.0"
zizmor = "1.30.1"

[tasks.setup]
description = "Install the repository's Git hooks"
run = "hk install --mise"

[tasks.check]
description = "Check all repository files"
run = "hk check --all"

[tasks.fix]
description = "Fix modified repository files"
run = "hk fix"

[tasks.pre-commit]
description = "Run the pre-commit hook"
run = "hk run pre-commit"

[tasks.ci]
description = "Run the checks required by CI"
run = [
  "hk validate",
  "hk check --all",
]
