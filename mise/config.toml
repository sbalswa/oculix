min_version = "2026.10.9"

[settings]
lockfile = true

[tools]
bats = { version = "1.14.0", os = ["linux", "macos"] }
betterleaks = "1.9.0"
hk = "2.6.0"
jactionlint = "2.1.0"
shellcheck = "0.11.0"
zizmor = "1.30.1"

[tasks.setup]
description = "Install the repository's Git hooks"
run = "hk install --mise"

[tasks.ci]
description = "Run the checks required by CI"
run = "hk check --all"

[tasks."test:toolchain-maintenance"]
description = "Run the mocked toolchain-maintenance Bats suite"
run = "bats tests/toolchain-maintenance"
run_windows = "echo Toolchain-maintenance Bats tests run on Unix hosts."

[tasks."test:dependency-qualification"]
description = "Run the dependency qualification contract suite"
run = "mise -E web-e2e exec -- node --test .github/scripts/dependency-qualification/*.test.mjs"
