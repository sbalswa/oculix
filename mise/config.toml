min_version = "2026.10.9"

[settings]
lockfile = true

[tools]
betterleaks = "1.9.0"
hk = "2.6.0"
jactionlint = "2.1.0"
shellcheck = "0.11.0"
zizmor = "1.30.1"

[tasks.setup]
description = "Install the repository's Git hooks"
run = "hk install --mise"

[tasks.ci]
description = "Run the checks required by CI"
run = "hk check --all"
